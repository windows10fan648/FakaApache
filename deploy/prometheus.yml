global:
  scrape_interval: 15s

scrape_configs:
  # Requires the Prometheus blackbox-exporter running on 127.0.0.1:9115.
  - job_name: fakaapache
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:8080/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
