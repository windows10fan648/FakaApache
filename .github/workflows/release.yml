name: Build and release merged pull requests

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: fakaapache-linux-x86_64
            runner: ubuntu-24.04
            platform: linux
            triplet: x64-linux-static
          - asset: fakaapache-linux-aarch64
            runner: ubuntu-24.04
            platform: linux-arm64
            triplet: arm64-linux-static
          - asset: fakaapache-windows-x86_64
            runner: windows-2025
            platform: windows
            triplet: x64-windows-static
            architecture: x64
          - asset: fakaapache-windows-arm64
            runner: windows-2025
            platform: windows
            triplet: arm64-windows-static
            architecture: ARM64

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Install Linux build tools
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Install Linux ARM64 cross compiler
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure Linux x86_64
        if: matrix.platform == 'linux'
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/.github/vcpkg-triplets

      - name: Configure Linux ARM64
        if: matrix.platform == 'linux-arm64'
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
          VCPKG_FORCE_SYSTEM_BINARIES: '1'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=aarch64
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/.github/vcpkg-triplets

      - name: Configure Windows
        if: matrix.platform == 'windows'
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A ${{ matrix.architecture }}
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build Linux
        if: startsWith(matrix.platform, 'linux')
        run: cmake --build build --config Release --parallel

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: cmake --build build --config Release --parallel

      - name: Validate and load-test Linux build
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cp siteconfig.fakaapache ci-siteconfig.fakaapache
          printf '\nrate_limit_requests_per_minute = 100000\nrate_limit_burst = 1000\n' >> ci-siteconfig.fakaapache
          ./build/fakaapache --config ci-siteconfig.fakaapache > server-validation.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/healthz > /dev/null; then
              break
            fi
            sleep 0.1
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server-validation.log
              exit 1
            fi
          done
          python3 tests/deployment_validation.py --url http://127.0.0.1:8080
          python3 tests/load_test.py --url http://127.0.0.1:8080/healthz --requests 200 --workers 16

      - name: Validate and load-test Windows x86_64 build
        if: matrix.platform == 'windows' && matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'fakaapache-validation.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'fakaapache-validation.err.log'
          Copy-Item 'siteconfig.fakaapache' 'ci-siteconfig.fakaapache'
          Add-Content -Path 'ci-siteconfig.fakaapache' -Value "`nrate_limit_requests_per_minute = 100000`nrate_limit_burst = 1000"
          $server = Start-Process -FilePath 'build/Release/fakaapache.exe' -ArgumentList '--config', 'ci-siteconfig.fakaapache' -WorkingDirectory (Get-Location) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
              $ready = $false
              for ($attempt = 0; $attempt -lt 50; $attempt++) {
                  try {
                      curl.exe --silent --show-error --fail http://127.0.0.1:8080/healthz | Out-Null
                      if ($LASTEXITCODE -eq 0) {
                          $ready = $true
                          break
                      }
                  } catch {
                      Start-Sleep -Milliseconds 100
                  }
                  if ($server.HasExited) {
                      Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                      throw 'FakaApache exited before becoming ready.'
                  }
              }
              if (-not $ready) { throw 'FakaApache did not become ready.' }
              python tests/deployment_validation.py --url http://127.0.0.1:8080
              python tests/load_test.py --url http://127.0.0.1:8080/healthz --requests 200 --workers 16
          } finally {
              if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Package Linux artifact
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          package="${{ matrix.asset }}"
          mkdir -p "release/${package}"
          cp build/fakaapache "release/${package}/"
          cp siteconfig.fakaapache README.md RELEASES.md "release/${package}/"
          cp -R www "release/${package}/"
          tar -C release -czf "release/${package}.tar.gz" "${package}"
          sha256sum "release/${package}.tar.gz" > "release/${package}.tar.gz.sha256"

      - name: Package Windows artifact
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $package = '${{ matrix.asset }}'
          $root = Join-Path 'release' $package
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item 'build/Release/fakaapache.exe' $root
          Copy-Item 'siteconfig.fakaapache', 'README.md', 'RELEASES.md' $root
          Copy-Item 'www' $root -Recurse
          Compress-Archive -Path $root -DestinationPath "release/$package.zip"
          $hash = (Get-FileHash "release/$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content "release/$package.zip.sha256" -Encoding ASCII

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}.*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fakaapache-${{ github.event.pull_request.merge_commit_sha || github.sha }}
          name: FakaApache build ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          generate_release_notes: true
          files: release-assets/*
