name: Pre-merge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64 validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: build/_vcpkg-2026.10.16/downloads
          key: vcpkg-${{ runner.os }}-x64-linux-static-2026.10.16-${{ hashFiles('vcpkg.json', '.github/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-linux-static-2026.10.16-

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DVCPKG_TARGET_TRIPLET=x64-linux-static
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/.github/vcpkg-triplets

      - name: Build
        run: cmake --build build --parallel

      - name: Validate and test
        shell: bash
        run: |
          set -euo pipefail
          cp siteconfig.fakaapache ci-siteconfig.fakaapache
          printf '\nrate_limit_requests_per_minute = 100000\nrate_limit_burst = 1000\n' >> ci-siteconfig.fakaapache
          ./build/fakaapache --config ci-siteconfig.fakaapache > ci-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                wait "$server_pid" 2>/dev/null || true
                return
              fi
              sleep 0.1
            done
            kill -KILL "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then cat ci-server.log || true; fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT
          ready=false
          for attempt in $(seq 1 50); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/healthz > /dev/null; then
              ready=true
              break
            fi
            sleep 0.1
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat ci-server.log
              exit 1
            fi
          done
          if [ "$ready" != true ]; then
            cat ci-server.log
            exit 1
          fi
          python3 tests/deployment_validation.py --url http://127.0.0.1:8080
          python3 tests/security_smoke.py --url http://127.0.0.1:8080
          python3 tests/load_test.py --url http://127.0.0.1:8080/healthz --requests 200 --workers 16

  windows-x86_64:
    name: Windows x86_64 validation
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: build/_vcpkg-2026.10.16/downloads
          key: vcpkg-${{ runner.os }}-x64-windows-static-2026.10.16-${{ hashFiles('vcpkg.json', '.github/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-2026.10.16-

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --config Release --parallel

      - name: Validate and test
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'fakaapache-ci.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'fakaapache-ci.err.log'
          Copy-Item 'siteconfig.fakaapache' 'ci-siteconfig.fakaapache'
          Add-Content -Path 'ci-siteconfig.fakaapache' -Value "`nrate_limit_requests_per_minute = 100000`nrate_limit_burst = 1000"
          $server = Start-Process -FilePath 'build/Release/fakaapache.exe' -ArgumentList '--config', 'ci-siteconfig.fakaapache' -WorkingDirectory (Get-Location) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
              $ready = $false
              for ($attempt = 0; $attempt -lt 50; $attempt++) {
                  curl.exe --silent --show-error --fail http://127.0.0.1:8080/healthz | Out-Null
                  if ($LASTEXITCODE -eq 0) { $ready = $true; break }
                  Start-Sleep -Milliseconds 100
                  if ($server.HasExited) {
                      Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                      throw 'FakaApache exited before becoming ready.'
                  }
              }
              if (-not $ready) {
                  Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                  throw 'FakaApache did not become ready.'
              }
              python tests/deployment_validation.py --url http://127.0.0.1:8080
              python tests/security_smoke.py --url http://127.0.0.1:8080
              python tests/load_test.py --url http://127.0.0.1:8080/healthz --requests 200 --workers 16
          } catch {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw
          } finally {
              if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
