name: Native ARM64 runtime validation

on:
  push:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm64:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Linux ARM64 runtime
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache vcpkg downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_vcpkg-2026.10.16/downloads
          key: vcpkg-${{ runner.os }}-arm64-linux-2026.10.16-${{ hashFiles('vcpkg.json', '.github/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-arm64-linux-2026.10.16-
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=arm64-linux
          cmake --build build --parallel
      - name: Validate and soak test
        shell: bash
        run: |
          set -euo pipefail
          cp siteconfig.fakaapache ci-siteconfig.fakaapache
          printf '\nrate_limit_requests_per_minute = 100000\nrate_limit_burst = 1000\n' >> ci-siteconfig.fakaapache
          ./build/fakaapache --config ci-siteconfig.fakaapache > arm64-runtime.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                wait "$server_pid" 2>/dev/null || true
                return
              fi
              sleep 0.1
            done
            kill -KILL "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then cat arm64-runtime.log || true; fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT
          for attempt in $(seq 1 50); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 0.1
          done
          if ! curl --silent --show-error --fail http://127.0.0.1:8080/healthz > /dev/null; then
            cat arm64-runtime.log
            exit 1
          fi
          python3 tests/deployment_validation.py --url http://127.0.0.1:8080
          python3 tests/security_smoke.py --url http://127.0.0.1:8080
          python3 tests/soak_test.py --url http://127.0.0.1:8080/healthz --duration 300 --workers 32

  windows-arm64:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Windows ARM64 runtime
    timeout-minutes: 60
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache vcpkg downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_vcpkg-2026.10.16/downloads
          key: vcpkg-${{ runner.os }}-arm64-windows-2026.10.16-${{ hashFiles('vcpkg.json', '.github/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-arm64-windows-2026.10.16-
      - name: Initialize ARM64 Visual C++ environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64_arm64
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl -DVCPKG_TARGET_TRIPLET=arm64-windows-static
          cmake --build build --parallel
      - name: Validate and soak test
        shell: pwsh
        run: |
          Copy-Item 'siteconfig.fakaapache' 'ci-siteconfig.fakaapache'
          Add-Content -Path 'ci-siteconfig.fakaapache' -Value "`nrate_limit_requests_per_minute = 100000`nrate_limit_burst = 1000"
          $stdout = Join-Path $env:RUNNER_TEMP 'fakaapache-arm64.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'fakaapache-arm64.stderr.log'
          $server = Start-Process -FilePath 'build/fakaapache.exe' -ArgumentList '--config', 'ci-siteconfig.fakaapache' -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
              $ready = $false
              for ($attempt = 0; $attempt -lt 50; $attempt++) {
                  if ($server.HasExited) { break }
                  curl.exe --silent --show-error --fail http://127.0.0.1:8080/healthz | Out-Null
                  if ($LASTEXITCODE -eq 0) { $ready = $true; break }
                  Start-Sleep -Milliseconds 100
              }
              if (-not $ready) {
                  Get-Content $stdout -ErrorAction SilentlyContinue
                  Get-Content $stderr -ErrorAction SilentlyContinue
                  throw 'FakaApache did not become ready.'
              }
              python tests/deployment_validation.py --url http://127.0.0.1:8080
              python tests/security_smoke.py --url http://127.0.0.1:8080
              python tests/soak_test.py --url http://127.0.0.1:8080/healthz --duration 300 --workers 32
          } catch {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw
          } finally {
              if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }

  macos-arm64:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: macOS Apple Silicon runtime
    timeout-minutes: 60
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache vcpkg downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_vcpkg-2026.10.16/downloads
          key: vcpkg-${{ runner.os }}-arm64-osx-2026.10.16-${{ hashFiles('vcpkg.json', '.github/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-arm64-osx-2026.10.16-
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DFAKAAPACHE_APPLE_SILICON_OPTIMIZATIONS=ON
          cmake --build build --parallel
      - name: Validate and soak test
        shell: bash
        run: |
          set -euo pipefail
          cp siteconfig.fakaapache ci-siteconfig.fakaapache
          printf '\nrate_limit_requests_per_minute = 100000\nrate_limit_burst = 1000\n' >> ci-siteconfig.fakaapache
          ./build/fakaapache --config ci-siteconfig.fakaapache > arm64-runtime.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                wait "$server_pid" 2>/dev/null || true
                return
              fi
              sleep 0.1
            done
            kill -KILL "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then cat arm64-runtime.log || true; fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT
          for attempt in $(seq 1 50); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 0.1
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat arm64-runtime.log
              exit 1
            fi
          done
          if ! curl --silent --show-error --fail http://127.0.0.1:8080/healthz > /dev/null; then
            cat arm64-runtime.log
            exit 1
          fi
          python3 tests/deployment_validation.py --url http://127.0.0.1:8080
          python3 tests/security_smoke.py --url http://127.0.0.1:8080
          python3 tests/soak_test.py --url http://127.0.0.1:8080/healthz --duration 300 --workers 32
